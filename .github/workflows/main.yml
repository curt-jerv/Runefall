
name: Generate Runefall Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate signing key
        run: |
          set -euo pipefail
          mkdir -p signing-material

          PASSWORD="$(openssl rand -hex 24)"

          keytool -genkeypair \
            -keystore signing-material/runefall-upload.p12 \
            -storetype PKCS12 \
            -alias runefall-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=Runefall, O=Runefall, C=CA"

          base64 -w 0 signing-material/runefall-upload.p12 \
            > signing-material/KEYSTORE_BASE64.txt

          printf '%s' "$PASSWORD" \
            > signing-material/KEYSTORE_PASSWORD.txt

          printf '%s' "runefall-upload" \
            > signing-material/KEY_ALIAS.txt

          rm signing-material/runefall-upload.p12

      - name: Save temporary setup files
        uses: actions/upload-artifact@v4
        with:
          name: runefall-signing-setup
          path: signing-material/*.txt
          retention-days: 1
          
