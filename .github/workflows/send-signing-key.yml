name: Send Signing Key To Unity Laptop

# One-time: seals the Play Store upload key (the secrets below) with the Unity laptop's public lock, so the download
# is useless to anyone but that laptop. Delete this file once the laptop has the key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      LAPTOP_LOCK: 
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Seal the key
        run: |
          set -euo pipefail
          mkdir -p work out
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > work/runefall-upload.p12
          test -s work/runefall-upload.p12
          # the upload certificate's fingerprint (public) -- compare with Play Console > App integrity
          keytool -list -v -keystore work/runefall-upload.p12 -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E 'Alias name|SHA1:|SHA256:'
          cat > work/KeySeal.java <<'JAVA'
          // Moves the Play Store upload key out of the HTML repo's GitHub secrets onto the laptop without ever showing it:
          // the laptop makes a lock (an RSA key pair), GitHub seals the key with the lock's public half, only the laptop opens it.
          //
          //   java KeySeal.java lock  <folder>              -> <folder>/seal-private.key + prints the public key (base64)
          //   java KeySeal.java seal  <publicBase64> <p12> <out>   (on GitHub; passwords/alias from the env vars below)
          //   java KeySeal.java open  <folder> <sealedFile>  -> <folder>/runefall-upload.p12 + <folder>/signing.properties
          //
          // Env vars for seal: ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD (may be empty), ANDROID_KEY_ALIAS.
          import java.io.*;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.*;
          import java.security.*;
          import java.security.spec.*;
          import java.util.*;
          import javax.crypto.*;
          import javax.crypto.spec.*;
          
          public class KeySeal {
              static final String RSA = "RSA/ECB/OAEPWithSHA-256AndMGF1Padding";
          
              public static void main(String[] a) throws Exception {
                  switch (a[0]) {
                      case "lock": lock(Paths.get(a[1])); break;
                      case "seal": seal(a[1], Paths.get(a[2]), Paths.get(a[3])); break;
                      case "open": open(Paths.get(a[1]), Paths.get(a[2])); break;
                      default: throw new IllegalArgumentException(a[0]);
                  }
              }
          
              static void lock(Path dir) throws Exception {
                  Files.createDirectories(dir);
                  KeyPairGenerator g = KeyPairGenerator.getInstance("RSA");
                  g.initialize(3072);
                  KeyPair kp = g.generateKeyPair();
                  Files.write(dir.resolve("seal-private.key"), kp.getPrivate().getEncoded());
                  System.out.println(Base64.getEncoder().encodeToString(kp.getPublic().getEncoded()));
              }
          
              static void seal(String pubB64, Path p12, Path out) throws Exception {
                  PublicKey pub = KeyFactory.getInstance("RSA").generatePublic(new X509EncodedKeySpec(Base64.getDecoder().decode(pubB64)));
                  String pw = env("ANDROID_KEYSTORE_PASSWORD"), kpw = env("ANDROID_KEY_PASSWORD"), alias = env("ANDROID_KEY_ALIAS");
                  if (kpw.isEmpty()) kpw = pw;
                  ByteArrayOutputStream body = new ByteArrayOutputStream();
                  DataOutputStream d = new DataOutputStream(body);
                  d.writeUTF(pw); d.writeUTF(kpw); d.writeUTF(alias);
                  byte[] ks = Files.readAllBytes(p12);
                  d.writeInt(ks.length); d.write(ks); d.flush();
          
                  byte[] aes = new byte[32], iv = new byte[12];
                  SecureRandom r = new SecureRandom(); r.nextBytes(aes); r.nextBytes(iv);
                  Cipher rc = Cipher.getInstance(RSA); rc.init(Cipher.ENCRYPT_MODE, pub);
                  byte[] wrapped = rc.doFinal(aes);
                  Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
                  c.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(aes, "AES"), new GCMParameterSpec(128, iv));
                  byte[] sealed = c.doFinal(body.toByteArray());
          
                  try (DataOutputStream o = new DataOutputStream(Files.newOutputStream(out))) {
                      o.writeInt(wrapped.length); o.write(wrapped); o.write(iv); o.write(sealed);
                  }
              }
          
              static void open(Path dir, Path in) throws Exception {
                  PrivateKey priv = KeyFactory.getInstance("RSA").generatePrivate(new PKCS8EncodedKeySpec(Files.readAllBytes(dir.resolve("seal-private.key"))));
                  byte[] wrapped, iv = new byte[12], sealed;
                  try (DataInputStream i = new DataInputStream(Files.newInputStream(in))) {
                      wrapped = new byte[i.readInt()]; i.readFully(wrapped); i.readFully(iv);
                      sealed = i.readAllBytes();
                  }
                  Cipher rc = Cipher.getInstance(RSA); rc.init(Cipher.DECRYPT_MODE, priv);
                  byte[] aes = rc.doFinal(wrapped);
                  Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
                  c.init(Cipher.DECRYPT_MODE, new SecretKeySpec(aes, "AES"), new GCMParameterSpec(128, iv));
                  DataInputStream d = new DataInputStream(new ByteArrayInputStream(c.doFinal(sealed)));
                  String pw = d.readUTF(), kpw = d.readUTF(), alias = d.readUTF();
                  byte[] ks = new byte[d.readInt()]; d.readFully(ks);
          
                  // prove the passwords open it before writing anything
                  KeyStore k = KeyStore.getInstance("PKCS12");
                  k.load(new ByteArrayInputStream(ks), pw.toCharArray());
                  if (k.getKey(alias, kpw.toCharArray()) == null) throw new IllegalStateException("alias " + alias + " not in the keystore");
          
                  Files.write(dir.resolve("runefall-upload.p12"), ks);
                  Properties p = new Properties();
                  p.setProperty("keystore", dir.resolve("runefall-upload.p12").toAbsolutePath().toString());
                  p.setProperty("storePassword", pw); p.setProperty("keyPassword", kpw); p.setProperty("keyAlias", alias);
                  try (OutputStream o = Files.newOutputStream(dir.resolve("signing.properties"))) { p.store(o, "Runefall Play Store upload key -- keep private, back up"); }
                  System.out.println("Opened: alias " + alias + ", keystore " + dir.resolve("runefall-upload.p12"));
              }
          
              static String env(String n) { String v = System.getenv(n); return v == null ? "" : v; }
          }
          JAVA
          java work/KeySeal.java seal "$LAPTOP_LOCK" work/runefall-upload.p12 out/runefall-key.sealed
          rm work/runefall-upload.p12

      - uses: actions/upload-artifact@v4
        with:
          name: runefall-key-sealed
          path: out/runefall-key.sealed
          retention-days: 1